name: Verify Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Domain, storage and main IPC tests
        run: npm test
      - name: Build UI and icons
        run: |
          npm run build:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run icons
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check repository resources and documentation
        run: node scripts/check-repository.cjs
      - name: Run the real desktop with isolated data
        run: npx --no-install electron scripts/smoke-desktop.cjs
      - name: Build Windows x64 portable executable
        run: npm run dist
